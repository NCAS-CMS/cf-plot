# ------------------------- Project information -------------------------

[project]
name = "cf-plot"
version = "3.6.0"
description = "Code-light plotting for earth science and aligned research"
keywords = [
    "visualisation",
    "visualization",
    "scientific-visualisation",
    "scientific-visualization",
    "atmospheric-science",
    "meteorology",
    "earth-science",
    "climate-science",
    "geoscience",
    "oceanography",
    "cartography",
    "cf-conventions",
    "cf",
    "data-analysis",
    "netcdf",
    "zarr",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Andy Heaps"},
    {name = "Sadie Bartholomew", email = "sadie.bartholomew@ncas.ac.uk"},
    {name = "Bryan Lawrence"},
]
maintainers = [
    {name = "Sadie Bartholomew", email = "sadie.bartholomew@ncas.ac.uk"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Oceanography",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11"
dependencies = [
    "cf-python>=3.17.0",
    "cartopy>=0.22.0",
]


[project.optional-dependencies]
tests = [
    "pytest",
    # The following are compulsory via the Cartopy dependency but imported
    # explicitly by the tests so best to list them explicitly here:
    "matplotlib",
    "contourpy",
    "netCDF4",
]
dev = [
    "black",
    "isort",
    "flake8",
    "codespell",
]
docs = [
    "sphinx",
    "sphinx-argparse",
    "sphinx-design",
    "pydata-sphinx-theme",
]


[project.urls]
Homepage = "https://ncas-cms.github.io/cf-plot/"
Documentation = "https://ncas-cms.github.io/cf-plot/"
Source = "https://github.com/NCAS-CMS/cf-plot"
Download = "https://pypi.org/project/cf-plot/"
Installation = "https://ncas-cms.github.io/cf-plot/installation.html"
"Release Notes" = "https://github.com/NCAS-CMS/cf-plot/blob/main/CHANGELOG.md"
Issues = "https://github.com/NCAS-CMS/cf-plot/issues"


# ------------------------- Packaging information -------------------------

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
where = ["."]
include = ["cfplot*"]


[tool.setuptools.package-data]
cfplot = ["colour/colourmaps/*"]


# ------------------------- Configuration of linting -------------------------
# Note we use a line length max of 79, so this needs to be enforced on the
# linting tools that check against this.

# black for code formatting: https://github.com/psf/black/
[tool.black]
line-length = 79
target-version = ["py311"]


# isort for importing sorting: https://github.com/PyCQA/isort/
[tool.isort]
profile = "black"
line_length = 79
skip_gitignore = true


# flake8 for detecting potential code errors: https://github.com/pycqa/flake8
[tool.flake8]
max-line-length = 79
ignore = [
    "W503",  # Incompatible with PEP 8
    "E203",  # Incompatible with Black
    "E501",  # Line length handled by Black
]


# codespell for spelling checks: https://github.com/codespell-project/codespell
[tool.codespell]
skip = ".git,.venv,build,dist"
