[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-plot"
version = "3.6.0"
description = "Code-light plotting for earth science and aligned research"
keywords = [
    "visualisation",
    "visualization",
    "scientific-visualisation",
    "scientific-visualization",
    "atmospheric-science",
    "meteorology",
    "earth-science",
    "climate-science",
    "geoscience",
    "oceanography",
    "cartography",
    "cf-conventions",
    "cf",
    "data-analysis",
    "netcdf",
    "zarr",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Andy Heaps", email = "andy.heaps@ncas.ac.uk" }]
maintainers = [
    {name = "Sadie Bartholomew", email = "sadie.bartholomew@ncas.ac.uk" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Oceanography",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11"
dependencies = [
    "cf-python>=3.17.0",
    "cartopy>=0.22.0",
]

[project.urls]
Homepage = "https://ncas-cms.github.io/cf-plot/"
Documentation = "https://ncas-cms.github.io/cf-plot/"
Source = "https://github.com/NCAS-CMS/cf-plot"
Download = "https://pypi.org/project/cf-plot/"
Installation = "https://ncas-cms.github.io/cf-plot/installation.html"
"Release Notes" = "https://github.com/NCAS-CMS/cf-plot/blob/main/CHANGELOG.md"
Issues = "https://github.com/NCAS-CMS/cf-plot/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["cfplot*"]

[tool.setuptools.package-data]
cfplot = ["colour/colourmaps/*"]

# To run the black checker with this configuration, execute 'black .' in the
# root of this repository. See https://black.readthedocs.io/en/stable/ for
# the 'black' documentation.
[tool.black]
line-length = 79

[tool.isort]
# Set for compatibility of 'black' and 'isort' auto-formatting tools
profile = "black"
# ... and since we set this against the black default line length:
line_length=79
