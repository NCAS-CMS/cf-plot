name: cfplot-test-env

channels:
  - conda-forge

dependencies:
  # Python
  - python=3.14.8
  - pip

  # CF ecosystem
  - cf-python=3.21.0
  - cfdm=1.13.3.0
  - cfunits=3.3.7
  - pyfive=1.2.1
  - umfive=0.4.0
  - udunits2=2.2.28
  - uritools=6.1.3

  # Scientific computing and plotting
  - numpy=2.5.4
  - scipy=1.18.0
  - matplotlib=3.11.2
  - cartopy=0.26.0
  - pandas=3.0.6
  - pyproj=3.8.0
  - shapely=2.2.0

  # Data access and formats
  - cftime=1.6.5
  - netcdf4=1.7.3
  - h5py=3.16.0
  - h5netcdf=1.8.1
  - xarray=2026.9.0
  - zarr=3.4.1
  - dask=2026.8.0
  - distributed=2026.8.0

  # Additional data and visualisation dependencies
  - pyarrow=24.0.0
  - bokeh=3.10.0

  # Testing
  - pytest=9.1.1
